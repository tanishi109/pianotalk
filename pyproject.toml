[project]
name = "pianotalk"
version = "0.4.1"
description = "Auto-record a MIDI piano and let Claude read/play phrases via MCP"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "mcp>=2.3,<3",
    "pyobjc-framework-Cocoa>=10.0",
]

[project.scripts]
pianotalk-recorder = "pianotalk.daemon:main"
pianotalk-mcp = "pianotalk.server:main"
pianotalk-ports = "pianotalk.daemon:list_ports"
pianotalk-fake-piano = "pianotalk.devtools:fake_piano"
pianotalk-monitor = "pianotalk.devtools:monitor"

[dependency-groups]
app = [
    "py2app>=0.28.10",
    "setuptools>=84.2.1",
]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["tests"]
